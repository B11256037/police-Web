<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-CARE：緊急報案系統</title>
  <!-- 在 CSS 套用前先讀取先前存的主題選擇，避免切成深色模式時先閃一下亮色再變暗 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ecare_theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="Style.css?v=20261004"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
</head>
<body>

  <!-- ====== HEADER ====== -->
  <header class="header" role="banner">
    <div class="header-top">
      <div class="header-logo">
        <div class="logo-icon" aria-hidden="true">E</div>
        <h1>E-CARE：緊急報案系統</h1>
      </div>
      <div class="header-controls">
        <button class="theme-toggle" id="themeToggle" aria-label="切換亮色/深色主題">
          <span class="theme-toggle-label" id="themeToggleLabel">深色模式</span>
        </button>
        <div class="system-status" role="status">
          <span class="status-led"></span><span>系統正常</span>
        </div>
      </div>
    </div>

    <!-- 頁籤 + 統計條 -->
    <div class="header-stats">
      <nav class="page-nav" aria-label="頁面切換">
        <button class="page-nav-btn active" data-page="map"     onclick="switchPage('map')">
          <span class="page-nav-icon"></span><span class="page-nav-label">今日事件</span>
        </button>
        <button class="page-nav-btn" data-page="officer" onclick="switchPage('officer')">
          <span class="page-nav-icon"></span><span class="page-nav-label">警員操作</span>
        </button>
        <button class="page-nav-btn" data-page="history" onclick="switchPage('history')">
          <span class="page-nav-icon"></span><span class="page-nav-label">歷史紀錄</span>
        </button>
      </nav>
      <div class="stats-divider"></div>
      <span class="stats-label">今日案件</span>
      <span class="stats-total" id="statTotal">0</span>
      <div class="stat-badge"><span class="stat-dot danger"></span><span class="stat-count" id="statDanger">0</span></div>
      <div class="stat-badge"><span class="stat-dot warn"></span><span class="stat-count" id="statWarn">0</span></div>
      <div class="stat-badge"><span class="stat-dot safe"></span><span class="stat-count" id="statSafe">0</span></div>
      <div class="stats-divider"></div>
      <div class="map-type-switcher" id="mapTypeSwitcher">
        <button class="map-type-btn active" data-type="emap" onclick="switchMapType('emap')" aria-label="電子地圖">
          <div class="map-type-thumb map-thumb-emap"></div>
          <span class="map-type-label">電子地圖</span>
        </button>
        <button class="map-type-btn" data-type="satellite" onclick="switchMapType('satellite')" aria-label="衛星地圖">
          <div class="map-type-thumb map-thumb-satellite"></div>
          <span class="map-type-label">衛星地圖</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ====================================================
       頁面一：今日事件（全螢幕地圖）
       ==================================================== -->
  <div class="page-content" id="page-map">
    <!-- 全螢幕 Leaflet 地圖 -->
    <div id="todayMap"></div>

    <!-- 右側資訊卡（點擊案件後顯示） -->
    <div class="map-info-card hidden" id="mapInfoCard">
      <button class="map-info-close" onclick="closeMapCard()" aria-label="關閉">✕</button>
      <div class="map-info-body" id="mapInfoBody"></div>
    </div>

    <!-- 右側縣市/鄉鎮面板（點擊縣市後顯示） -->
    <div class="county-panel hidden" id="countyPanel">
      <div class="county-panel-header">
        <span class="county-panel-title" id="countyPanelTitle"></span>
        <button class="county-panel-close" onclick="closeCountyPanel()" aria-label="關閉">✕</button>
      </div>
      <div class="county-panel-body" id="countyPanelBody"></div>
    </div>

    <!-- 懸浮地名提示 -->
    <div class="map-hover-tooltip hidden" id="mapHoverTooltip"></div>

    <!-- 左側：警察局所面板（點擊縣市後顯示） -->
    <div class="police-panel hidden" id="policePanel">
      <div class="police-panel-header">
        <span class="police-panel-title" id="policePanelTitle"></span>
        <button class="police-panel-close" onclick="hidePolicePanel()" aria-label="關閉">✕</button>
      </div>
      <div class="police-panel-body" id="policePanelBody"></div>
    </div>

    <!-- 左下：整合圖例 + 今日案件統計（可收合，避免案件多時擋住地圖） -->
    <div class="map-bottom-left">
      <div class="map-legend-stats" id="mapLegendStats">
        <div class="mls-header" id="mlsToggle" role="button" tabindex="0" aria-expanded="true" aria-label="展開/收合今日案件統計">
          <span class="mls-title">今日案件</span>
          <span class="mls-total" id="mtsTotal">0</span>
          <span class="mls-chev" id="mlsChev" aria-hidden="true">▾</span>
        </div>
        <div class="mls-body" id="mlsBody">
          <div class="mls-row"><span class="legend-dot danger"></span><span class="mls-label">高風險</span><span class="mls-val" id="mtsDanger">0</span></div>
          <div class="mls-row"><span class="legend-dot warn"></span><span class="mls-label">中風險</span><span class="mls-val" id="mtsWarn">0</span></div>
          <div class="mls-row"><span class="legend-dot safe"></span><span class="mls-label">低風險</span><span class="mls-val" id="mtsSafe">0</span></div>
          <div class="mls-row mls-row--inactive"><span class="legend-dot inactive"></span><span class="mls-label">已結案</span></div>
          <div class="mts-date" id="mtsDate"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====================================================
       頁面二：警員操作（原有三欄）
       ==================================================== -->
  <div class="page-content" id="page-officer" style="display:none;">
    <main class="main-content" role="main">

      <!-- 左欄：案件列表 -->
      <aside class="case-list-panel" aria-label="案件列表">
        <div class="panel-header">
          案件列表
          <span style="font-size:12px;color:var(--text-dim);" id="caseCount"></span>
        </div>
        <div class="case-list" id="caseList" role="list"></div>
      </aside>

      <!-- 中欄：案件詳細 -->
      <section class="detail-panel" aria-label="案件詳細資訊">
        <div class="panel-header">
          案件詳細
          <span style="font-size:11px;color:var(--text-dim);">點選左側案件查看</span>
        </div>
        <div class="detail-scroll" id="detailContent">
          <div class="no-case-selected">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            <p>請從左側選擇案件查看詳細資訊</p>
          </div>
        </div>
        <div class="log-panel">
          <div class="panel-header" style="padding:10px 16px;">
            操作紀錄<span style="font-size:11px;color:var(--text-dim);margin-left:8px;">最新在上</span>
          </div>
          <div class="log-list" id="logList"><div class="log-empty">尚無操作紀錄</div></div>
        </div>
      </section>

      <!-- 右欄：派遣方式（依視覺權重分組：主動作／次要操作／結案／誤報獨立隔開，避免情急誤點） -->
      <aside class="dispatch-panel" aria-label="派遣操作">
        <div class="panel-header">派遣方式</div>
        <div class="dispatch-buttons">
          <div class="dispatch-group">
            <div class="dispatch-group-label">立即派遣</div>
            <button class="dispatch-btn police"    onclick="handleDispatch('police',    ' 警力派遣')"   aria-label="警力派遣"><span class="btn-icon"></span>警力派遣</button>
            <button class="dispatch-btn ambulance" onclick="handleDispatch('ambulance', ' 救護派遣')"   aria-label="救護派遣"><span class="btn-icon"></span>救護派遣</button>
            <button class="dispatch-btn fire"      onclick="handleDispatch('fire',      ' 消防派遣')"   aria-label="消防派遣"><span class="btn-icon"></span>消防派遣</button>
          </div>

          <div class="dispatch-group">
            <div class="dispatch-group-label">結案</div>
            <button class="dispatch-btn close" onclick="handleDispatch('close', ' 已結案')" aria-label="已結案"><span class="btn-icon"></span>已結案</button>
          </div>

          <!-- 標記誤報：破壞性且較少用的操作，故意拉開距離、弱化視覺權重，避免跟上方派遣警力誤觸 -->
          <div class="dispatch-group dispatch-group--danger">
            <div class="dispatch-group-label">誤報</div>
            <button class="dispatch-btn misreport" onclick="handleDispatch('misreport', ' 標記誤報')" aria-label="標記誤報"><span class="btn-icon"></span>標記誤報</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- ====================================================
       頁面三：歷史紀錄
       ==================================================== -->
  <div class="page-content" id="page-history" style="display:none;">
    <div class="full-page-inner">
      <div class="history-header">
        <div class="history-title-row">
          <h2 class="section-title">案件歷史紀錄</h2>
          <!-- 熱點分析尚未接上圖表，先放按鈕佔位，點擊顯示開發中提示 -->
          <button class="btn-view-stats" onclick="openHistoryStatsPlaceholder()" aria-label="檢視統計">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
            檢視統計
          </button>
        </div>
        <div class="history-filters">
          <!-- 日期選擇 -->
          <input type="date" class="modal-input" id="filterDate" onchange="renderHistory()" style="width:150px;"/>
          <select class="modal-select" id="filterRisk" onchange="renderHistory()" style="width:110px;">
            <option value="">全部風險</option>
            <option value="High">高風險</option>
            <option value="Medium">中風險</option>
            <option value="Low">低風險</option>
          </select>
          <select class="modal-select" id="filterStatus" onchange="renderHistory()" style="width:110px;">
            <option value="">全部狀態</option>
            <option value="處理中">處理中</option>
            <option value="已轉人工">已轉人工</option>
            <option value="誤報">誤報</option>
            <option value="已處理">已處理</option>
          </select>
          <input class="modal-input" id="filterKeyword" oninput="renderHistory()" placeholder="搜尋…" style="width:160px;"/>
          <button class="btn-cancel" onclick="clearHistoryFilters()" style="padding:8px 12px;">清除</button>
          <span class="history-count" id="historyCount"></span>
        </div>
      </div>

      <!-- 日期分組顯示 -->
      <div id="historyGroups"></div>
    </div>
  </div>

  <!-- ====== MODAL ====== -->
  <div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div style="position:absolute;inset:0;" onclick="closeModal()"></div>
    <div class="modal" role="document">
      <div class="modal-title" id="modalTitle">確認操作</div>
      <div class="modal-subtitle" id="modalSubtitle"></div>
      <div id="modalExtraFields"></div>
      <div class="modal-field">
        <label class="modal-label" id="modalNoteLabel" for="modalNote">操作備註</label>
        <textarea class="modal-textarea" id="modalNote" rows="3" placeholder="請輸入操作備註（選填）"></textarea>
      </div>
      <!-- 高風險案件的破壞性操作（標記誤報／已結案）二次確認：不勾選無法按確認 -->
      <label class="modal-confirm-guard hidden" id="modalConfirmGuard" for="modalConfirmCheck">
        <input type="checkbox" id="modalConfirmCheck"/>
        <span id="modalConfirmGuardText"></span>
      </label>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-confirm" id="modalConfirmBtn" onclick="confirmModal()">確認</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script src="county_data.js"></script>
  <script src="town_data.js"></script>
  <script src="police_data(更新版-1).js?v=20261004b"></script>
  <script src="Main.js?v=20261004"></script>
  <script src="pages.js?v=20261004"></script>
  <script src="taiwan_map.js?v=20261004"></script>
  <script src="police_map.js?v=20261004"></script>
</body>

</html>
